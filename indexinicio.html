<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo Fashion</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    
<header>

    <div class="titulo">
        <h1>Estilo Fashion</h1>
        <h4>vista a sua essência</h4>
    </div>


    <nav class="icones">
        <a href="#" aria-label="Minha conta">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        </a>
        <a href="#" aria-label="Sacola">
            <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        </a>
    </nav>

    <section class="hero">
        <div class="hero-texto">
          <span class="hero-eyebrow">Coleção Essência · 2026</span>
          <h1>Leveza que<br>veste você.</h1>
          <p>Uma coleção feita de texturas naturais, tons acolhedores e peças que acompanham todos os seus momentos.</p>
      
          <div class="hero-botoes">
            <a href="#colecao" class="btn btn-escuro">Conhecer coleção <span>→</span></a>
            <a href="#historia" class="btn btn-claro">Nossa história</a>
          </div>
        </div>
      
        <div class="hero-imagem">
          <img src="img/hero.jpg" alt="Modelo vestindo a Blusa Serena">
      
          <div class="hero-destaque">
            <div>
              <small>DESTAQUE</small>
              <strong>Blusa Serena</strong>
            </div>
            <a href="#produto" class="btn-redondo" aria-label="Ver produto">→</a>
          </div>
        </div>
      </section>
</header>
</body>
</html>
